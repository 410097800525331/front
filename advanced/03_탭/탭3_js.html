<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>탭 메뉴</title>
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            cursor: pointer;
        }

        .tabs div {
            padding: 10px 20px;
            background: #eee;
            border-radius: 4px;
        }

        .tabs .active {
            background: royalblue;
            color: white;
        }

        .tab-content>div {
            /* 내용을 모두 숨김 */
            display: none;
            padding: 20px;
            background: #f5f5f5;
            margin-top: 10px;
            border-radius: 4px;
        }

        /* .active인 내용만 보임 */
        .tab-content>div.active {
            display: block;
        }
    </style>
</head>

<body>

    <h2>탭 메뉴</h2>

    <!-- 탭 버튼들 -->
    <div class="tabs">
        <div class="active">탭 1</div>
        <div>탭 2</div>
        <div>탭 3</div>
    </div>

    <!-- 탭 내용들 -->
    <div class="tab-content">
        <div class="active">탭 1의 내용입니다.</div>
        <div>탭 2의 내용입니다.</div>
        <div>탭 3의 내용입니다.</div>
    </div>

    <script>
        const tabs = document.querySelector(".tabs").children;
        // const tabs = document.querySelectorAll(".tabs div");
        const contents = document.querySelector(".tab-content").children;
        // const contents = document.querySelectorAll(".tab-content div");

        for (let i = 0; i < tabs.length; i++) {
            tabs[i].addEventListener("click", function () {

                // 모든 탭 버튼 active 제거
                for (let tab of tabs) tab.classList.remove("active");

                // 클릭된 탭에 active 추가
                this.classList.add("active");

                // 전체 콘텐츠 숨기기
                for (let content of contents) content.classList.remove("active");

                // 클릭된 탭과 같은 인덱스의 콘텐츠 보여주기
                contents[i].classList.add("active");
            });
        }
    </script>

</body>

</html>
