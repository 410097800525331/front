<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>현대자동차</title>
    <style>
        .model-section {
            text-align: center;
        }
        .tabs {
            text-align: left;
        }

        h2 {
            font-size: 44px;
        }

        .model-section {
            max-width: 1400px;
            margin: 50px auto;
        }

        .tabs {
            /* 1위 이미지 설명글의 위치 기준 */
            position: relative;
            padding: 20px 140px;
        }

        /* 탭 버튼 */
        .tab-menu {
            position: absolute;
            left: calc(50% + 85px);
            margin: 20px 0;
        }

        .tab-menu .tab {
            background: none;
            border: none;
            padding-right: 8px;
            font-size: 15px;
            cursor: pointer;
            color: #777;
        }
        .tab-menu .tab:not(:last-of-type)::after {
            content: "|";
            margin-left: 16px;
        }

        .tab-menu .tab.active {
            color: #007fa8;
            font-weight: bold;
        }

        /* 탭 내용 */
        .tab-content {
            display: none;
            align-items: end;
            margin-top: 30px;
        }
        .tab-content.active {
            display: flex;
        }

        .tab-content img {
            display: block;
            width: 224px;
            height: 168px;
            margin-right: 35px;
        }
        /* 1위 표시 텍스트 */
        .tab-content .top::after {
            content: '1위';
            position: absolute;
            top:50px;
            width: 60px;
            height: 60px;
            line-height: 60px;
            background: #007FA8;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .tab-content .top img {
            width: 576px;
            height: 432px;
            margin-right: 70px;
        }

        /* 이미지 설명글 */
        .tab-content span {
            display: block;
            font-weight: 600;
            margin: 8px 0;
        }

        /* 1위 이미지 설명글 */
        .tab-content .top span {
            position: absolute;
            top:100px;
            left: calc(50% + 85px);
            font-size: 2.375rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <section class="model-section">
        <h2>Model</h2>
        <p class="desc">최근 한 달 동안 고객님들이 가장 많이 구매하신 모델입니다.</p>

        <!-- 탭 -->
        <div class="tabs">
            <!-- 탭 버튼 -->
            <div class="tab-menu">
                <div class="inner">
                    <!-- 사용자 정의 속성: data-* -->
                    <button class="tab active" data-tab="all">전체</button>
                    <button class="tab" data-tab="s20s30">2~30대</button>
                    <button class="tab" data-tab="s40">40대</button>
                    <button class="tab" data-tab="s50">50대</button>
                </div>
            </div>
            <!-- 탭 콘텐츠 -->
            <div class="tab-contents">
                <div class="tab-content active" id="all">
                    <div class="top">
                        <img src="assets/GN09_EXT.jpg" alt="1위. 그랜저 Hybrid">
                        <span>1위. 그랜저 Hybrid</span>
                    </div>
                    <div>
                        <img src="assets/CN22_EXT.jpg" alt="2위. 아반떼">
                        <span>2위. 아반떼</span>
                    </div>
                    <div>
                        <img src="assets/FX02_EXT.jpg" alt="3위. 더 뉴 팰리세이드 Hybrid">
                        <span>3위. 더 뉴 팰리세이드 Hybrid</span>
                    </div>
                </div>
                <div class="tab-content" id="s20s30">
                    <div class="top">
                        <img src="assets/CN22_EXT.jpg" alt="1위. 아반떼">
                        <span>1위. 아반떼</span>
                    </div>
                    <div>
                        <img src="assets/MX08_EXT.jpg" alt="2위. 싼타페 Hybrid">
                        <span>2위. 싼타페 Hybrid</span>
                    </div>
                    <div>
                        <img src="assets/GN09_EXT.jpg" alt="3위. 그랜저 Hybrid">
                        <span>3위. 그랜저 Hybrid</span>
                    </div>
                </div>
                <div class="tab-content" id="s40">
                    <div class="top">
                        <img src="assets/GN09_EXT.jpg" alt="1위. 그랜저">
                        <span>1위. 그랜저</span>
                    </div>
                    <div>
                        <img src="assets/FX02_EXT.jpg" alt="2위. 디 올 뉴 팰리세이드 Hybrid">
                        <span>2위. 디 올 뉴 팰리세이드 Hybrid</span>
                    </div>
                    <div>
                        <img src="assets/CN22_EXT.jpg" alt="3위. 아반떼">
                        <span>3위. 아반떼</span>
                    </div>
                </div>
                <div class="tab-content" id="s50">
                    <div class="top">
                        <img src="assets/GN09_EXT.jpg" alt="1위. 그랜저">
                        <span>1위. 그랜저</span>
                    </div>
                    <div>
                        <img src="assets/CN22_EXT.jpg" alt="2위. 아반떼">
                        <span>2위. 아반떼</span>
                    </div>
                    <div>
                        <img src="assets/NX17_EXT.jpg" alt="3위. 투싼">
                        <span>3위. 투싼</span>
                    </div>
                </div>
            </div><!-- //.tab-contents -->
        </div><!-- //.tabs -->
    </section>

    <script>
        // 문서의 탭 버튼 요소들을 선택
        const btn = document.querySelectorAll('.tab');
        // 문서의 탭 내용 요소들을 선택
        const content = document.querySelectorAll('.tab-content');

        // 버튼 요소들을 모두 반복, item은 버튼 요소들 중 하나를 가리킴
        btn.forEach(item => {
            // 특정 버튼을 클릭하면
            item.addEventListener('click', () => {
                //  <button class="tab active" data-tab="all">전체</button>
                // 클릭한 버튼의 data-tab 속성의 값을 target에 할당
                // 첫 번째 버튼을 클릭하면 target = all;
                // 두 번째 버튼을 클릭하면 target = s20s30;
                // 세 번째 버튼을 클릭하면 target = s40;
                // 네 번째 버튼을 클릭하면 target = s50;
                const target = item.dataset.tab

                // 탭 active 초기화
                btn.forEach(t => t.classList.remove('active'));
                content.forEach(c => c.classList.remove('active'));

                // 선택된 버튼의 색상 변경
                item.classList.add('active');

                // 아이디가 target인 요소를 선택
                // #all
                // #s20s30
                // #s40
                // #s50
                document.getElementById(target).classList.add('active');
            });
        });

    </script>
</body>

</html>
