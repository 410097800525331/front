<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메가박스 - 멀티 아이템 케로셀</title>
  <!-- jquery.bxslider.min.css 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
  <!-- 제이쿼리 라이브러리 -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <!-- bxslider 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>
  <style>
    #section .inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    #section h2 {
      padding: 50px 0;
      font-size: 28px;
      font-weight: normal;
      color: #351f66;
    }

    /* bxSlider 외부 감싸는 박스의 배경, 테두리, 그림자 제거 */
    .bx-wrapper {
      background: none;
      border: none;
      box-shadow: none;
    }

    .bxslider div a {
      display: block;
      height: 170px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 5px 5px 10px 0 rgba(0, 0, 0, 0.2);
    }

    .bxslider div:hover img {
      transform: translateY(-50%);
    }

    /* 좌우 버튼 */
    .bx-wrapper .bx-controls-direction a {
      background: none;
      width: 16px;
      height: 29px;
    }

    .bx-wrapper .bx-prev {
      left: -50px;
    }

    .bx-wrapper .bx-next {
      right: -50px;
    }
  </style>

</head>

<body>
  <div id="section">
    <div class="inner">
      <h2>메가박스 안내</h2>
      <div class="bxslider">
        <div><a href="#"><img src="assets/bg-main-boutiq.png" alt="이미지1"></a></div>
        <div><a href="#"><img src="assets/bg-main-comfort.png" alt="이미지2"></a></div>
        <div><a href="#"><img src="assets/bg-main-dolbyatmos.png" alt="이미지3"></a></div>
        <div><a href="#"><img src="assets/bg-main-dolbycinema.png" alt="이미지4"></a></div>
        <div><a href="#"><img src="assets/bg-main-dva.png" alt="이미지5"></a></div>
        <div><a href="#"><img src="assets/bg-main-led.png" alt="이미지5"></a></div>
        <div><a href="#"><img src="assets/bg-main-mx4d.png" alt="이미지5"></a></div>
        <div><a href="#"><img src="assets/bg-main-private.png" alt="이미지5"></a></div>
        <div><a href="#"><img src="assets/bg-main-recliner.png" alt="이미지5"></a></div>
        <div><a href="#"><img src="assets/bg-main-suite.png" alt="이미지5"></a></div>
      </div>
    </div>
  </div>

  <script>
    $('.bxslider').bxSlider({
      auto: true, // 자동 슬라이드
      //autoControls: true, // 시작/정지 버튼
      stopAutoOnClick: true,
      pager: false, // 인디케이터
      slideWidth: 170, // 슬라이드 가로 크기

      //mode: 'fade', // 슬라이드 방식
      // 'horizontal'|'vertical'|'fade'
      //controls: false, // 좌우 버튼
      speed: 800, // 전환 속도(ms)
      pause: 4000, // 자동 슬라이드 간격
      autoHover: true, // 마우스 오버 시 멈춤
      minSlides: 6,
      maxSlides: 6,
      moveSlides: 1,
      slideMargin: 16,

      prevText: '<img src="assets/btn-specialtheater-prev.png" alt="이전">',
      nextText: '<img src="assets/btn-specialtheater-next.png" alt="이후">',
    });
  </script>
</body>

</html>
