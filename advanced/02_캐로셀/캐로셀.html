<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가로 스크롤 페이지 - 캐로셀</title>

  <!-- bxSlider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 전체 페이지 스크롤 방지 */
    }

    #scroll-container {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      /* 가로 스크롤바 표시 */
      overflow-y: hidden;
      white-space: nowrap;
      /* 자식 요소 줄바꿈 방지 */

      /* 스크롤바 스타일 */
      scrollbar-width: thin;
      scrollbar-color: rgba(158, 161, 161, 0.502) transparent;
    }

    #scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    #scroll-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #scroll-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
    }

    #scroll-container::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.8);
    }

    .horizontal-wrap {
      display: inline-flex;
      width: max-content;
      height: 100%;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: #fff;
      font-weight: bold;
      vertical-align: top;
      position: relative;
    }

    .page1 {
      background: #ff6b6b;
    }

    .page2 {
      background: #4d96ff;
    }

    .page3 {
      background: #6bcf63;
    }

    .page4 {
      background: #ffc93c;
    }

    /* --- 캐로셀 스타일 --- */
    .carousel-wrapper {
      width: 800px;
      /* 요청하신 가로 800px */
      /* height: 400px;  bxSlider가 이미지 크기에 맞춤, 여기선 이미지 크기로 제어하거나 bx-wrapper 조정 */
    }

    .bxslider div img {
      width: 800px;
      height: 400px;
      object-fit: cover;
      display: block;
      /* 이미지 하단 공백 제거 */
    }

    /* bxSlider 커스텀 (중앙 정렬 보조) */
    .bx-wrapper {
      margin: 0 auto;
      /* 중앙 정렬 */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      /* 그림자 효과 추가 */
      border: none !important;
      /* 기본 테두리 제거 */
      background: transparent !important;
    }
  </style>

  <!-- jQuery & bxSlider JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>

  <script>
    $(document).ready(function () {
      $('.bxslider').bxSlider({
        auto: true,      // 자동 재생
        autoControls: true, // 재생/정지 버튼
        stopAutoOnClick: true,
        pager: true,     // 하단 점 페이징
        slideWidth: 800, // 슬라이드 너비
        mode: 'horizontal',
        speed: 500,
        pause: 4000      // 4초마다 넘어감
      });
    });
  </script>
</head>

<body>
  <main id="scroll-container">
    <div class="horizontal-wrap">
      <section class="page page1">Page 1</section>

      <!-- Page 2에 캐로셀 배치 -->
      <section class="page page2">
        <div class="carousel-wrapper">
          <div class="bxslider">
            <div><img src="https://picsum.photos/id/1018/800/400" alt="Image 1"></div>
            <div><img src="https://picsum.photos/id/1015/800/400" alt="Image 2"></div>
            <div><img src="https://picsum.photos/id/1019/800/400" alt="Image 3"></div>
          </div>
        </div>
      </section>

      <section class="page page3">Page 3</section>
      <section class="page page4">Page 4</section>
    </div>
  </main>

  <script>
    // --- 스크롤 로직 (기존 유지) ---
    const container = document.getElementById('scroll-container');
    let target = container.scrollLeft;
    let current = target;
    let isMoving = false;

    container.addEventListener("wheel", e => {
      // bxSlider 내부에서의 휠 이벤트와 충돌 방지 (필요 시 조건문 추가)
      // 여기서는 전체 페이지 스크롤이 우선으로 동작하도록 함
      e.preventDefault();

      if (!isMoving) target = current = container.scrollLeft;
      target = Math.max(0, Math.min(container.scrollWidth - container.clientWidth, target + e.deltaY));

      if (!isMoving) {
        isMoving = true;
        scrollAnimate();
      }
    }, { passive: false });

    function scrollAnimate() {
      current += (target - current) * 0.05;
      container.scrollLeft = current;
      if (Math.abs(target - current) < 0.5) {
        isMoving = false;
      } else {
        requestAnimationFrame(scrollAnimate);
      }
    }
  </script>
</body>

</html>
