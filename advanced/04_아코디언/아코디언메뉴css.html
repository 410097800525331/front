<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>아코디언 UI</title>
    <style>
        /* 초기값 */
        * {
            box-sizing: border-box;
        }

        body,
        ul {
            margin: 0;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        a {
            text-decoration: none;
        }

        body {
            font-size: 15px;
            line-height: 1.6;
            font-family: "굴림", sans-serif;
            background: #fff;
        }

        header {
            width: 200px;
            height: 650px;
            border: 1px solid;
            padding: 16px;
        }

        /* 1depth */
        .main>li {
            background: rgb(210, 86, 86);
            text-align: center;
            border-bottom: 1px solid rgb(174, 40, 40);
        }

        .main>li>a {
            font-size: 16px;
            color: #333;
            display: block;
            padding: 8px 0;
        }

        /* 2depth */
        .sub {
            background: rgb(209, 123, 123);
            padding: 8px 0;
        }

        .sub li a {
            position: relative;
            font-size: 14px;
            color: #333;
        }

        .sub li a::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: rgba(174, 40, 40, 0.493);
            transform: scaleX(0);
            transform-origin: 0 0;
            transition: 0.5s;
        }

        .sub li a:hover::before {
            transform: scaleX(1);
        }
    </style>
</head>

<body>
    <header>
        <nav id="gnb">
            <!-- 1depth -->
            <ul class="main">
                <li><a href="#">축제소개</a>
                    <!-- 2depth -->
                    <ul class="sub">
                        <li><a href="#">초대의글</a></li>
                        <li><a href="#">축제개요</a></li>
                        <li><a href="#">축제연혁</a></li>
                        <li><a href="#">오시는길</a></li>
                    </ul>
                </li>
                <li><a href="#">행사안내</a>
                    <ul class="sub">
                        <li><a href="#">셔틀버스안내</a></li>
                        <li><a href="#">행사안내</a></li>
                        <li><a href="#">행사일정</a></li>
                        <li><a href="#">소공연장</a></li>
                    </ul>
                </li>
                <li><a href="#">홍보마당</a>
                    <ul class="sub">
                        <li><a href="#">축제소식</a></li>
                        <li><a href="#">보도자료</a></li>
                        <li><a href="#">음식레시피</a></li>
                    </ul>
                </li>
                <li><a href="#">참여마당</a>
                    <ul class="sub">
                        <li><a href="#">참가후기</a></li>
                        <li><a href="#">연꽃갤러리</a></li>
                        <li><a href="#">포토갤러리</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 모든 서브메뉴 선택 및 초기 상태 설정
            const subMenus = document.querySelectorAll(".sub");

            // 페이지 로드 시 서브메뉴 숨기기 (CSS로 처리하는 것이 더 좋지만 자바스크립트로 구현 시)
            subMenus.forEach(sub => {
                sub.style.display = "none";
                sub.style.overflow = "hidden";
            });

            // 2. 메인 메뉴 항목들에 이벤트 연결
            const mainItems = document.querySelectorAll(".main > li");

            mainItems.forEach(li => {
                // 마우스 올렸을 때 (mouseenter)
                li.addEventListener("mouseenter", (e) => {
                    const sub = e.currentTarget.querySelector(".sub");
                    if (sub) {
                        slideDown(sub);
                    }
                });

                // 마우스 뗐을 때 (mouseleave)
                li.addEventListener("mouseleave", (e) => {
                    const sub = e.currentTarget.querySelector(".sub");
                    if (sub) {
                        slideUp(sub);
                    }
                });
            });
        });

        /**
         * slideDown 함수 구현
         */
        function slideDown(target) {
            target.style.display = "block";
            const height = target.scrollHeight; // 실제 요소의 높이 측정
            target.style.height = "0px";
            target.style.transition = "height 300ms ease-out";

            // 브라우저가 높이 0을 인식한 후 실행되도록 유도
            requestAnimationFrame(() => {
                target.style.height = height + "px";
            });
        }

        /**
         * slideUp 함수 구현
         */
        function slideUp(target) {
            target.style.height = "0px";

            // 애니메이션이 끝난 후 display를 none으로 변경
            target.addEventListener("transitionend", function handler() {
                target.style.display = "none";
                target.removeEventListener("transitionend", handler);
            }, { once: true });
        }
    </script>

</body>

</html>
