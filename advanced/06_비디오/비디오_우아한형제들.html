<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 구글 아이콘 라이브러리 설정 -->
    <!-- 이전 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- 현재 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>우아한형제들</title>
    <style>
        /* 초기화 */
        body,
        h2,
        p {
            margin: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            cursor: pointer;
            border: none;
        }

        /* 섹션 */
        .section {
            text-align: center;
            padding: 140px 0;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.075rem;
        }

        p {
            font-size: 1.125rem;
            letter-spacing: -0.025rem;
            margin-top: 20px;
            margin-bottom: 80px;
        }

        /* 비디오 */
        .video-container {
            position: relative;
            width: 780px;
            height: 440px;
            margin: 0 auto;
            border: 10px solid red;
        }

        button {
            position: absolute;
            border-radius: 30%;
            background-color: rgba(0, 0, 0, .15);
            background-color: rgb(134, 134, 6);
            color: #fff;
        }

        #btn-play {
            opacity: 0;
        }

        #btn-play span {
            font-size: 3rem;
        }

        /* play/pause 버튼 */
        #btn-play {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
        }

        /* 음소거 버튼 */
        #btn-mute {
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="section">
        <h2>세상 모든 것이 식지 않도록</h2>
        <p>음식 배달, 장보기 쇼핑, 로봇까지<br>우아한형제들이 가장 앞서 달립니다</p>
        <div class="video-container">
            <video id="my-video" autoplay muted>
                <source src="assets/main_baemin_reset.0d972b27.mp4" type="video/mp4">
                브라우저가 비디오 태그를 지원하지 않습니다.
            </video>
            <div class="controls">
                <button id="btn-play">
                    <!-- 이전 방식 -->
                    <span class="material-icons">pause</span>
                    <!-- <span class="material-icons">play_arrow</span> -->
                </button>
                <button id="btn-mute">
                    <!-- 현재 방식 -->
                    <span id="mute-icon" class="material-symbols-outlined">volume_up</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('my-video');
        const playBtn = document.querySelector('#btn-play span');

        // 재생 버튼 클릭 시
        playBtn.addEventListener('click', () => {
            // video.paused
            //  - 비디오가 paused(일시정지) 상태이면 true, 아니면 false
            if (video.paused) {
                // 비디오 재생
                video.play();
                // 버튼의 텍스트를 '일시정지'로 지정
                playBtn.textContent = 'pause';
            } else {
                // 비디오 일시 정지
                video.pause();
                // 버튼의 텍스트를 '재생'으로 지정
                playBtn.textContent = 'play_arrow';
            }
        });

        const muteBtn = document.getElementById('btn-mute');
        const muteIcon = document.getElementById('mute-icon');

        // 음소거 토글 로직
        muteBtn.addEventListener('click', () => {
            // 최소 방문 시 무음이 아닌 상태
            // 즉, video.muted가 false인 상태
            video.muted = !video.muted;

            if (video.muted) {
                // volumne_up -> volume_off
                muteIcon.textContent = 'volume_off'; // 구글 아이콘 이름
            } else {
                // volume_off -> volume_up
                muteIcon.textContent = 'volume_up';  // 구글 아이콘 이름
            }
        });

        // 비디오 종료 시 버튼 상태 초기화 (보너스)
        video.addEventListener('ended', () => {
            playBtn.textContent = 'play_arrow';
        });

        // 버튼 숨기기/보이기
        // play/pause 보이기
        video.addEventListener('mouseenter', () => {
            playBtn.parentElement.style.opacity = 1;
        });
        // play/pause 숨기기
        video.addEventListener('mouseleave', () => {
            playBtn.parentElement.style.opacity = 0;
        });

        // play/pause 버튼 위에 마우스를 올렸을 때
        playBtn.addEventListener('mouseenter', () => {
            playBtn.parentElement.style.opacity = 1;
        });
    </script>

</body>

</html>
