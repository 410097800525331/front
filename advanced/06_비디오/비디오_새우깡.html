<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새우깡: 유튜브 비디오</title>
    <style>
        /* reset */
        button {
            background: none;
            border: none;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border:none;
        }

        /* 유튜브 비디오 */
        .view {
            display: flex;
        }
        .screen {
            width: 640px;
            height: 390px;
        }
        .caption {
            width: 269px;
            height: 358px;
            padding: 15px;
            background: #ccc;
            border: 1px solid #000;
        }
        /* 비디오 열기 */
        .vid-open {
            position: relative;
            width: 236px;
            height: 155px;
            padding-top: 5px;
            background: url(assets/bgMovie.gif) no-repeat;
            text-align: center;
        }
        .play-btn-icon {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>
    <article>
        <h2>보통 '깡'이 아니다 「새우깡 블랙」</h2>
        <div class="view">
            <div class="screen"><iframe src="https://www.youtube.com/embed/PQHiDTDBOxQ&t?autoplay=1&mute=1&controls=0&loop=1&playlist=qW19oOVSmi0&rel=0&modestbranding=1&playsinline=1&fs=0&disablekb=1"></iframe></div>
            <div class="caption"></div>
        </div>
    </article>
    <aside>
        <div class="vid-open">
            <a href="#">
                <img src="assets/imgSample.jpg" alt="">
                <img src="assets/btnPlay.png" alt="play button" class="play-btn-icon">
            </a>
        </div>
    </aside>
</body>
</html>
