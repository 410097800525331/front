<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>YouTube Custom Player</title>
  <style>
    #player {
      width: 560px;
      height: 315px;
      object-fit: cover;
      margin: 30px;
    }
    iframe {
      border:none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="player">
    <iframe src="https://www.youtube.com/embed/qW19oOVSmi0"></iframe>
  </div>

  <!-- 
      옵션
        - autoplay=1	자동 재생
        - mute=1	음소거 (자동재생 시 필수)
        - controls=0	재생 컨트롤 표시 안함
        - loop=1	반복 재생
        - playlist=VIDEO_ID	loop 사용 시 필수
        - start=초	시작 시간
        - end=초	종료 시간
        - rel=0	영상 종료 후 관련 영상 최소화
        - modestbranding=1	유튜브 로고 최소화
        - playsinline=1	모바일에서 전체화면 방지
        - fs=0	전체화면 버튼 비활성화
        - disablekb=1	키보드 제어 비활성화
  -->
  <div id="player">
    <iframe src="https://www.youtube.com/embed/qW19oOVSmi0?autoplay=1&mute=1&controls=0&loop=1&playlist=qW19oOVSmi0&rel=0&modestbranding=1&playsinline=1&fs=0&disablekb=1"></iframe>
  </div>

</body>

</html>
