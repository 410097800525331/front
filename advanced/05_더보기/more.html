<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>이미지 더보기 구현</title>
    <style>
        * {box-sizing: border-box;}
        .wrap {
            max-width:1100px;
            margin: 0 auto;
            text-align: center;
        }
        #item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            list-style: none;
            padding: 0;
        }

        .item-card {
            width: 230px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }

        .item-card img {
            width: 100%;
            height: 330px;
            object-fit: cover;
        }

        .item-card p {
            padding: 10px;
            margin: 0;
            font-weight: bold;
        }

        #load-more {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="wrap">
        <ul id="item-list"></ul>
        <button id="load-more">더보기</button>
    </div>

    <script src="data.js"></script>
    <script>
        // 1. 변수 선언
        let currentIndex = 0; // 시작 인덱스
        const increment = 12;  // 한 번에 보여줄 단위
        const listContainer = document.getElementById('item-list');
        const loadMoreBtn = document.getElementById('load-more');

        // 2. 아이템을 화면에 그리는 함수
        function renderItems(start, count) {
            // slice를 이용해 데이터 배열에서 필요한 만큼만 잘라냄
            /* 
                array.slice(start, end): 
                    - 원본 배열을 변경하지 않고, 
                      지정한 구간(start부터 end-1까지)의 요소를 새 배열로 복사
                    - start는 시작 인덱스
                    - end는 끝 인덱스
            */
            const targetData = itemData.slice(start, start + count);

            targetData.forEach(item => {
                // <li></li>
                const li = document.createElement('li');
                // <li class="item-card"></li>
                li.className = 'item-card';
                /* 
                    { 
                        id: 1, 
                        title: "아이템 1", 
                        img: "assets/넘버원.jpg" 
                    }

                    <li class="item-card">
                        <img src="assets/넘버원.jpg" alt="아이템 1">
                        <p>아이템 1</p>
                    </li>
                */

                li.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <p>${item.title}</p>
                `;
                /* 
                    <ul id="item-list">
                        <li class="item-card">
                            <img src="assets/넘버원.jpg" alt="아이템 1">
                            <p>아이템 1</p>
                        </li>
                        <li class="item-card">
                            <img src="assets/넘버원.jpg" alt="아이템 1">
                            <p>아이템 1</p>
                        </li>
                    </ul>
                */
                listContainer.appendChild(li);
            });

            // 다음 데이터를 출력할 수 있도록 
            // targetData.length 크기 만큼 증가
            currentIndex += targetData.length;

            // 3. 더 이상 불러올 데이터가 없으면 버튼 숨기기
            if (currentIndex >= itemData.length) {
                loadMoreBtn.style.display = 'none';
            }
        }

        // 초기 로드 (첫 3줄 표시)
        renderItems(currentIndex, increment);

        // 버튼 클릭 이벤트
        loadMoreBtn.addEventListener('click', () => {
            renderItems(currentIndex, increment);
        });
    </script>
</body>

</html>
